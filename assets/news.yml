- title: A fantastic showing at County Backpack
  date: 4 APR 2026
  text: "Last weekend seven teams from Hatfield Forest District threw themselves into the challenge of County Backpack, along with 600 scouts from across the county, in the countryside around Thorrington Camp near Colchester. Follow the link to read about it!"
