  link: "/assets/2026-04-04-backpack-report/2026-04-04 County Backpack Report.pdf"

- title: CamJam 2026 - Bookings Open
  date: 07 MAR 2026
  text: "31 Jul - 7 Aug 2027 will bring us CamJam 2027. The team is gearing up to provide an unforgettable week of adventure, friendship and discovery as we bring together around 3,000 Scouts and Guides plus 2,000 volunteers from across the UK and overseas. Location: Abbots Ripton Estate (Huntingdon)"
  img: /assets/2027-08-07-CamJam/xcropped-camjampreviewtrans1.png.pagespeed.ic.cEg9mNnTZt.png
  imgAlt: CamJam 2027
  link: https://camjam.org.uk/

